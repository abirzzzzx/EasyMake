<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Abz AI - Powered by NVIDIA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
    color: #e0e0e0;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(118, 74, 255, 0.1) 0%, transparent 70%);
    animation: pulse 8s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
    50% { transform: scale(1.1) rotate(5deg); opacity: 0.8; }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 900px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo {
    font-size: 48px;
    font-weight: 700;
    background: linear-gradient(135deg, #764aff 0%, #00d4ff 50%, #764aff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    text-shadow: 0 0 40px rgba(118, 74, 255, 0.5);
    animation: glow 3s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .tagline {
    font-size: 16px;
    color: #888;
    font-weight: 400;
  }

  .tagline span {
    color: #764aff;
    font-weight: 600;
  }

  #suggestionBox {
    width: 100%;
    max-width: 700px;
    min-height: 100px;
    padding: 25px 30px;
    margin-bottom: 30px;
    font-size: 1.1rem;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(30, 30, 50, 0.8) 0%, rgba(20, 20, 40, 0.9) 100%);
    border: 1px solid rgba(118, 74, 255, 0.3);
    text-align: center;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: break-word;
    line-height: 1.6;
    box-shadow: 0 8px 32px rgba(118, 74, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }

  #suggestionBox:hover {
    border-color: rgba(118, 74, 255, 0.5);
    box-shadow: 0 12px 40px rgba(118, 74, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  #askAbzBtn {
    padding: 16px 40px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #764aff 0%, #5a33d9 100%);
    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(118, 74, 255, 0.4);
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
  }

  #askAbzBtn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }

  #askAbzBtn:hover::before {
    left: 100%;
  }

  #askAbzBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(118, 74, 255, 0.6);
  }

  #askAbzBtn:active {
    transform: translateY(0);
  }

  #askContainer {
    display: none;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 700px;
  }

  #chatLog {
    background: linear-gradient(135deg, rgba(20, 20, 35, 0.95) 0%, rgba(15, 15, 25, 0.98) 100%);
    border-radius: 20px;
    padding: 25px;
    height: 450px;
    overflow-y: auto;
    font-size: 1rem;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border: 1px solid rgba(118, 74, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
  }

  #chatLog::-webkit-scrollbar {
    width: 8px;
  }

  #chatLog::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
  }

  #chatLog::-webkit-scrollbar-thumb {
    background: rgba(118, 74, 255, 0.5);
    border-radius: 10px;
  }

  #chatLog::-webkit-scrollbar-thumb:hover {
    background: rgba(118, 74, 255, 0.7);
  }

  .message {
    padding: 14px 20px;
    border-radius: 18px;
    max-width: 85%;
    word-break: break-word;
    animation: fadeIn 0.3s ease;
    position: relative;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    background: linear-gradient(135deg, #764aff 0%, #5a33d9 100%);
    color: #ffffff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(118, 74, 255, 0.3);
  }

  .message.abz {
    background: rgba(255, 255, 255, 0.08);
    color: #e0e0e0;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .message .sender-name {
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 6px;
    opacity: 0.8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #inputArea {
    display: flex;
    gap: 12px;
    padding: 10px;
    background: rgba(30, 30, 50, 0.8);
    border-radius: 50px;
    border: 1px solid rgba(118, 74, 255, 0.3);
    backdrop-filter: blur(10px);
  }

  #userInput {
    flex-grow: 1;
    padding: 16px 24px;
    border-radius: 50px;
    border: none;
    background: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    font-size: 1rem;
    outline: none;
    transition: all 0.3s ease;
  }

  #userInput::placeholder {
    color: #666;
  }

  #userInput:focus {
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 20px rgba(118, 74, 255, 0.2);
  }

  #sendBtn {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #764aff 0%, #5a33d9 100%);
    color: #ffffff;
    cursor: pointer;
    font-size: 1.3rem;
    font-weight: 600;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(118, 74, 255, 0.4);
  }

  #sendBtn:hover {
    transform: scale(1.1) rotate(-10deg);
    box-shadow: 0 6px 25px rgba(118, 74, 255, 0.6);
  }

  #sendBtn:active {
    transform: scale(0.95);
  }

  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(118, 74, 255, 0.3);
    border-radius: 50%;
    border-top-color: #764aff;
    animation: spin 1s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .powered-by {
    margin-top: 40px;
    font-size: 0.85rem;
    color: #666;
    text-align: center;
  }

  .powered-by span {
    color: #764aff;
    font-weight: 600;
  }

  @media (max-width: 768px) {
    .container {
      padding: 20px 15px;
    }

    .logo {
      font-size: 36px;
    }

    #suggestionBox {
      padding: 20px;
      min-height: 80px;
    }

    #chatLog {
      height: 350px;
      padding: 15px;
    }

    #inputArea {
      padding: 8px;
    }

    #userInput {
      padding: 14px 18px;
    }

    #sendBtn {
      width: 48px;
      height: 48px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="logo">✨ Abz AI</h1>
    <p class="tagline">Your intelligent assistant powered by <span>NVIDIA GLM</span></p>
  </div>

  <div id="suggestionBox">Loading inspiration...</div>
  
  <button id="askAbzBtn">💬 Start Chatting</button>
  
  <div id="askContainer">
    <div id="chatLog"></div>
    <div id="inputArea">
      <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <div class="powered-by">
    Powered by <span>NVIDIA API</span> • Model: GLM-5.2
  </div>
</div>

<script>
  const NVIDIA_API_KEY = 'nvapi-YOUR_API_KEY_HERE'; // Replace with your NVIDIA API key
  const NVIDIA_API_URL = 'https://integrate.api.nvidia.com/v1/chat/completions';
  const MODEL_NAME = 'thudm/glm-5.2';

  const suggestionBox = document.getElementById('suggestionBox');
  const askBtn = document.getElementById('askAbzBtn');
  const askContainer = document.getElementById('askContainer');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatLog = document.getElementById('chatLog');
  
  let suggestionList = [];
  let suggestionIndex = 0;
  let charIndex = 0;
  let typingForward = true;
  const typingSpeed = 40;
  const pauseTime = 3500;

  let chatHistory = JSON.parse(sessionStorage.getItem('chatHistory')) || [];

  function createMessageElement(sender, message) {
    const div = document.createElement('div');
    div.classList.add('message');
    div.classList.add(sender === 'You' ? 'user' : 'abz');
    
    const nameDiv = document.createElement('div');
    nameDiv.classList.add('sender-name');
    nameDiv.textContent = sender;
    div.appendChild(nameDiv);
    
    const textDiv = document.createElement('div');
    textDiv.textContent = message;
    div.appendChild(textDiv);
    
    return div;
  }

  function renderChat() {
    chatLog.innerHTML = '';
    for (const entry of chatHistory) {
      chatLog.appendChild(createMessageElement(entry.sender, entry.message));
    }
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  async function fetchSuggestion() {
    try {
      const res = await fetch(NVIDIA_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${NVIDIA_API_KEY}`
        },
        body: JSON.stringify({
          model: MODEL_NAME,
          messages: [
            {
              role: 'system',
              content: 'You are a fun, expressive AI that gives short, punchy coding ideas with emojis and excitement! Keep it under 80 characters.'
            },
            {
              role: 'user',
              content: 'Give one short coding idea suggestion with emojis and excitement!'
            }
          ],
          max_tokens: 100,
          temperature: 0.8
        })
      });
      
      if (!res.ok) {
        throw new Error(`HTTP error! status: ${res.status}`);
      }
      
      const data = await res.json();
      return data.choices[0]?.message?.content.trim() || 'Build a cool AI project! 🚀';
    } catch (error) {
      console.error('Error fetching suggestion:', error);
      return 'Create something amazing with code! 💻✨';
    }
  }

  async function prepareSuggestions() {
    if (suggestionList.length > 0) return;
    suggestionList = [];
    for (let i = 0; i < 5; i++) {
      const sug = await fetchSuggestion();
      suggestionList.push(sug);
    }
  }

  function splitLongText(text, maxLen = 40) {
    const words = text.split(' ');
    let lines = [];
    let line = '';
    for (const word of words) {
      if ((line + (line ? ' ' : '') + word).length <= maxLen) {
        line += (line ? ' ' : '') + word;
      } else {
        if (line) lines.push(line);
        if (word.length > maxLen) {
          lines.push(word);
          line = '';
        } else {
          line = word;
        }
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  async function typeLoop() {
    if (suggestionList.length === 0) {
      suggestionBox.textContent = 'Loading inspiration...';
      await prepareSuggestions();
      setTimeout(typeLoop, 1000);
      return;
    }
    const currentText = suggestionList[suggestionIndex];
    if (typingForward) {
      if (charIndex < currentText.length) {
        charIndex++;
        showTextWithWrap(currentText.slice(0, charIndex));
        setTimeout(typeLoop, typingSpeed);
      } else {
        typingForward = false;
        setTimeout(typeLoop, pauseTime);
      }
    } else {
      if (charIndex > 0) {
        charIndex--;
        showTextWithWrap(currentText.slice(0, charIndex));
        setTimeout(typeLoop, typingSpeed / 2);
      } else {
        typingForward = true;
        suggestionIndex = (suggestionIndex + 1) % suggestionList.length;
        if (suggestionIndex === 0) suggestionList = [];
        setTimeout(typeLoop, 500);
      }
    }
  }

  function showTextWithWrap(text) {
    const lines = splitLongText(text, 40);
    suggestionBox.textContent = lines.join('\n');
  }

  askBtn.addEventListener('click', () => {
    if (askContainer.style.display === 'flex') {
      askContainer.style.display = 'none';
      askBtn.textContent = '💬 Start Chatting';
    } else {
      askContainer.style.display = 'flex';
      renderChat();
      userInput.focus();
      askBtn.textContent = '✕ Close Chat';
    }
  });

  async function getAbzResponse(userMsg) {
    try {
      const response = await fetch(NVIDIA_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${NVIDIA_API_KEY}`
        },
        body: JSON.stringify({
          model: MODEL_NAME,
          messages: [
            { role: 'system', content: 'You are Abz AI, a helpful and friendly assistant powered by NVIDIA GLM. Be concise, informative, and engaging.' },
            ...chatHistory.map(e => ({
              role: e.sender === 'You' ? 'user' : 'assistant',
              content: e.message
            })),
            { role: 'user', content: userMsg }
          ],
          max_tokens: 500,
          temperature: 0.7
        })
      });
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const data = await response.json();
      return data.choices[0]?.message?.content || 'No response.';
    } catch (error) {
      console.error('Error getting response:', error);
      return 'Sorry, I\'m having trouble connecting right now. Please check the API key configuration.';
    }
  }

  async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) return;
    
    chatHistory.push({ sender: 'You', message });
    renderChat();
    userInput.value = '';
    sessionStorage.setItem('chatHistory', JSON.stringify(chatHistory));

    // Show loading indicator
    const loadingDiv = document.createElement('div');
    loadingDiv.classList.add('message', 'abz');
    loadingDiv.innerHTML = '<div class="sender-name">Abz</div><div class="loading"></div>';
    chatLog.appendChild(loadingDiv);
    chatLog.scrollTop = chatLog.scrollHeight;

    const reply = await getAbzResponse(message);
    
    // Remove loading indicator
    chatLog.removeChild(loadingDiv);
    
    chatHistory.push({ sender: 'Abz', message: reply });
    renderChat();
    sessionStorage.setItem('chatHistory', JSON.stringify(chatHistory));
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  // Start suggestion typing loop
  prepareSuggestions().then(typeLoop);
</script>
</body>
</html>
